name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression, FX and Photo Physics tests
        timeout-minutes: 15
        run: |
          npm run dev -- --strictPort > /tmp/photo-vj-vite.log 2>&1 &
          vj_server_pid=$!
          trap 'kill "$vj_server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/photomosaic-vj/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/photomosaic-vj/ > /dev/null
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
      - name: Verify published Controller and Output
        timeout-minutes: 15
        env:
          TEST_URL: https://kkodamalab.github.io/photomosaic-vj/
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          node tests/verify-published.mjs
          REPORT_DIR=test-results/public-phase1 node tests/browser.mjs
          REPORT_DIR=test-results/public-phase2 node tests/phase2-browser.mjs
          REPORT_DIR=test-results/public-phase3 node tests/phase3-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-test-results
          path: test-results/public-*/
          retention-days: 14
